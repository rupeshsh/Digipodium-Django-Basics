<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      function check() {
        var a = document.getElementById("t1").value;
        if (a=="b") {
          document.getElementById("res").innerHTML ="<i>Empty Enter Your name</i>";
          document.getElementById("t1").style.border = "2px solid red";
        } 
        else {
          document.getElementById("res").innerHTML = "invalid";
          document.getElementById("t1").style.border = "2px solid green";
        }
      }
    </script>
  </head>
  <body>
    <input type="text" id="t1" />
    <span id="res"></span>
    <br />
    <br />
    <button onfocus="check()">Check</button>
  </body>
</html>
